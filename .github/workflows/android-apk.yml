name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', 'build.js', 'src/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # يبني الموقع أولًا (dist/index.html) — مهمة syncWebAssets في
      # android/app/build.gradle تُحزّم هذا الملف نفسه داخل التطبيق، فيبقى
      # التطبيق دائمًا نسخة طبق الأصل من آخر بناء للموقع
      - run: npm ci
      - run: node build.js --prod
        env:
          NODE_ENV: production
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Build release APK (debug-signed)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AcademicQuran-apk
          path: android/app/build/outputs/apk/release/app-release.apk
