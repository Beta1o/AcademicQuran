name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', 'build.js', 'src/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # يبني الموقع أولًا (dist/index.html) — مهمة syncWebAssets في
      # android/app/build.gradle تُحزّم هذا الملف نفسه داخل التطبيق، فيبقى
      # التطبيق دائمًا نسخة طبق الأصل من آخر بناء للموقع
      - run: npm ci
      - run: node build.js --prod
        env:
          NODE_ENV: production
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          SITE_URL: ${{ vars.SITE_URL }}

      # مفتاح توقيع ثابت (انظر التعليق في android/app/build.gradle) — يُنشأ
      # مرة واحدة فقط إن لم يكن موجودًا أصلًا في المستودع؛ بعد إنشائه وحفظه
      # هناك يبقى كل بناء لاحق موقَّعًا بالمفتاح نفسه تلقائيًا.
      - name: Generate debug keystore if missing
        working-directory: android
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -v -keystore app/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Academic Quran Debug,O=Academic Quran,C=US"
          fi

      - name: Build release APK (debug-signed)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AcademicQuran-apk
          path: android/app/build/outputs/apk/release/app-release.apk
