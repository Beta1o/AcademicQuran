plugins {
    id 'com.android.application'
}

// الموقع مبني كملف واحد قائم بذاته (../../dist/index.html — كل CSS/JS مضمّن
// داخله)، فتُزامَن نسخة منه إلى أصول التطبيق قبل كل بناء، كي لا يُحزَم التطبيق
// أبدًا بنسخة قديمة من الموقع. يجب تشغيل `node build.js --prod` في جذر
// المستودع قبل هذا البناء لتوليد dist/index.html أولًا (يفعله سير العمل تلقائيًا).
def webAssetsDir = layout.buildDirectory.dir('generated/webassets')

// كانت هذه المهمة تُزامن index.html وapi/i18n/** فقط — لكن كل ورقة عمل
// تُحمَّل كسولًا عبر <script src="api/ws/<id>.js"> عند فتحها فعلًا (انظر
// ensureBodyLoaded في app.js)، وهذه المسارات لم تكن تُزامَن إطلاقًا، فيفشل
// طلب السكربت صامتًا (404 داخل file:///android_asset/) وتبقى أي ورقة تُفتح
// فارغة تمامًا — بالضبط ما يبدو للمستخدم وكأن الورقة "اختفت" عند فتحها.
// api/worksheets.json وapi/meta.json تبقيان مستثناتين: واجهة عامة للموقع لا
// يستخدمهما التطبيق نفسه إطلاقًا (لا فائدة من تضخيم حجم الـAPK بهما).
tasks.register('syncWebAssets', Sync) {
    from(rootProject.file('../dist')) {
        include 'index.html'
        include 'api/i18n/**'
        include 'api/ws/**'
        into 'www'
    }
    into webAssetsDir
}

// GitHub Actions ينشئ ~/.android/debug.keystore عشوائيًا من جديد في كل
// تشغيل (لا حالة تُحفَظ بين التشغيلات على ذلك المسار) — فكل APK كان يُوقَّع
// بمفتاح مختلف عن السابق، ويرفض أندرويد تثبيت أي تحديث لتطبيق موقَّع بمفتاح
// يخالف المثبَّت فعليًا (يفرض إزالة النسخة القديمة يدويًا في كل مرة). مفتاح
// تصحيح ثابت مضمَّن هنا في المستودع (android/app/debug.keystore، كلمة مروره
// وأسماء مفاتيحه القيم الافتراضية المعروفة لـkeytool/أدوات أندرويد — لا خطر
// أمني هنا، فهذا توقيع تطوير لا يستخدم لأي نشر رسمي على متجر Play) يجعل كل
// بناء مستقبلي يحمل التوقيع نفسه، فتُثبَّت التحديثات فوق بعضها طبيعيًا.
signingConfigs {
    debug {
        storeFile rootProject.file('app/debug.keystore')
        storePassword 'android'
        keyAlias 'androiddebugkey'
        keyPassword 'android'
    }
}

android {
    namespace 'com.beta1o.academicquran'
    compileSdk 35

    defaultConfig {
        applicationId 'com.beta1o.academicquran'
        minSdk 26   // أيقونة adaptive فقط (anydpi-v26) — أندرويد 8.0 فأعلى
        targetSdk 35
        versionCode 1
        versionName '1.1.0'
    }

    sourceSets {
        main {
            assets.srcDirs += webAssetsDir.get().asFile
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // توقيع الإصدار بمفتاح التطوير كي يُثبَّت الملف كما هو مباشرة؛
            // للنشر الرسمي على متجر Play استبدله بمفتاح توقيع حقيقي (signingConfig)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
    }
}

tasks.named('preBuild') { dependsOn 'syncWebAssets' }
